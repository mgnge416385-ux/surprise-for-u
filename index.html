<div class="birthday-card">
  <div class="stars">✦ ♡ ✧ ♡ ✦</div>

  <div class="envelope">💌</div>

  <h1>A Little Surprise for You 🩵</h1>

  <p class="message">
    This letter isn't meant for everyone.
    It's meant for someone special…
    Could that someone be you?
  </p>

  <div class="buttons">
    <button onclick="sayYes()">YES 💗</button>
    <button class="no" onclick="sayNo()">NO 🙈</button>
  </div>

  <p id="reply"></p>
</div>
